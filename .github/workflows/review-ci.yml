name: Review CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test and package backend
        working-directory: backend
        run: ./mvnw --batch-mode clean test package

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build frontend image without pushing
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          build-args: |
            VITE_API_BASE_URL=/api

      - name: Build backend image without pushing
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
