server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for React Router paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache HTML so Back cannot restore a logged-in shell
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    # API reverse proxy (same-domain approach)
    location /api/ {
        proxy_pass http://mawrid-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client supplied forwarding headers at the trusted edge.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

